{# Join / request / leave control. Context: space, membership, pending (bool), small #}
<form method="post" action="{% url 'spaces:membership' space.pk %}" class="inline-form"{% if membership %} data-confirm="Leave {{ space.name }}?{% if space.requires_approval %} You'd need to be approved again to come back.{% endif %}"{% endif %}>
  {% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}">
  {% if membership %}
    <button type="submit" name="action" value="leave" class="btn btn-ghost{% if small %} btn-sm{% endif %}" aria-label="Joined. Leave {{ space.name }}">Joined ✓</button>
  {% elif pending %}
    <button type="submit" name="action" value="cancel" class="btn btn-ghost{% if small %} btn-sm{% endif %}" aria-label="Request sent. Cancel your request to join {{ space.name }}">Requested</button>
  {% elif space.requires_approval %}
    <button type="submit" name="action" value="join" class="btn btn-primary{% if small %} btn-sm{% endif %}">Request to join</button>
  {% else %}
    <button type="submit" name="action" value="join" class="btn btn-primary{% if small %} btn-sm{% endif %}">Join</button>
  {% endif %}
</form>
