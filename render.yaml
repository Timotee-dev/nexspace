services:
  - type: web
    name: nexspace
    runtime: python
    buildCommand: pip install -r requirements-prod.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --workers 2 --timeout 180
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: SITE_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
  - type: cron
    name: nexspace-scheduled
    runtime: python
    schedule: "*/15 * * * *"
    buildCommand: pip install -r requirements-prod.txt
    startCommand: python manage.py run_scheduled
    envVars:
      - fromGroup: nexspace-env

envVarGroups:
  - name: nexspace-env
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
