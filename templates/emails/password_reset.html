<!doctype html>
<html><body style="margin:0;padding:24px;background:#f4f5f9;font-family:Arial,sans-serif;color:#151c2f">
<table role="presentation" width="100%" style="max-width:520px;margin:0 auto;background:#ffffff;border-radius:14px;padding:32px">
<tr><td>
{% load static %}<p style="margin:0 0 24px"><img src="{{ protocol }}://{{ domain }}{% static 'img/icon-192.png' %}" width="40" height="40" alt="" style="vertical-align:middle;border-radius:10px"> <span style="font-weight:800;font-size:20px;vertical-align:middle;margin-left:8px">NexSpace</span></p>
<p style="margin:0 0 16px">Hi {{ user.get_short_name }},</p>
<p style="margin:0 0 24px">Someone asked to reset the password for your NexSpace account.</p>
<p style="margin:0 0 24px"><a href="{{ protocol }}://{{ domain }}{% url 'accounts:password-reset-confirm' uidb64=uid token=token %}" style="background:#f5c451;color:#221a03;padding:12px 20px;border-radius:999px;text-decoration:none;font-weight:700;display:inline-block">Choose a new password</a></p>
<p style="margin:0;font-size:13px;color:#535d7a">The link works once. If you didn't ask for this, ignore this email.</p>
</td></tr></table></body></html>
