<div class="manage-head">
  <div><h1>Admin</h1><p class="muted small">{{ dept.name }} · {{ dept.faculty.university.short_name }}</p></div>
  {% if is_super and departments %}
  <form method="get" class="dept-switch"><label for="dept-switch" class="visually-hidden">Department</label>
    <select id="dept-switch" name="dept" onchange="this.form.submit()">{% for d in departments %}<option value="{{ d.pk }}" {% if d.pk == dept.pk %}selected{% endif %}>{{ d.name }} ({{ d.faculty.university.short_name }})</option>{% endfor %}</select>
    <noscript><button class="btn btn-ghost btn-sm">Switch</button></noscript>
  </form>
  {% endif %}
</div>
<nav class="settings-nav" aria-label="Admin sections">
  <a href="{% url 'manage:overview' %}" {% if section == "overview" %}aria-current="page"{% endif %}>Overview</a>
  <a href="{% url 'manage:users' %}" {% if section == "users" %}aria-current="page"{% endif %}>People</a>
  <a href="{% url 'manage:courses' %}" {% if section == "courses" %}aria-current="page"{% endif %}>Courses</a>
  <a href="{% url 'manage:sessions' %}" {% if section == "sessions" %}aria-current="page"{% endif %}>Sessions</a>
  <a href="{% url 'manage:spaces' %}" {% if section == "spaces" %}aria-current="page"{% endif %}>Spaces</a>
  <a href="{% url 'manage:announcements' %}" {% if section == "announcements" %}aria-current="page"{% endif %}>Announcements</a>
  <a href="{% url 'moderation:queue' %}">Reports</a>
  <a href="{% url 'moderation:log' %}">Moderation history</a>
  {% if is_super %}<a href="{% url 'manage:departments' %}" {% if section == "departments" %}aria-current="page"{% endif %}>Departments</a>
  <a href="{% url 'manage:topics' %}" {% if section == "topics" %}aria-current="page"{% endif %}>Topics</a>{% endif %}
</nav>
